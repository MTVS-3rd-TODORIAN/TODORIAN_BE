services:
  app:
    image: "221082200491.dkr.ecr.ap-northeast-2.amazonaws.com/todorian:todorian"
    ports:
      - "80:8080"
    mem_limit: 512m
    depends_on:
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://awseb-e-a7gjdqggpy-stack-awsebrdsdatabase-finezinwjjmp.cpiycgkkk147.ap-northeast-2.rds.amazonaws.com:3306/TODORIAN
      - SPRING_DATASOURCE_USERNAME=todorian
      - SPRING_DATASOURCE_PASSWORD=todorian
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=8704b6707c11f6225d354c624a41212651b1c8357ef609ecb42688d3a25ac4bdea3b92accfd5acc4108a53eb44f36caf0941c80616967e503e17e251ef078ba9
    networks:
      - app-network

  redis:
    container_name: todorian-redis
    image: redis:6.2.6-alpine
    ports:
      - ${REDIS_PORT}:6379
    networks:
      - db-network
      - cache-network
    restart: always
    profiles: ["cache", "required"]

  prometheus:
    container_name: todorian-prometheus
    image: prom/prometheus:v2.37.6
    volumes:
      - todorian-prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    ports:
      - "9090:9090"
    networks:
      - metric-network
    profiles:
      - metric

  grafana:
    container_name: todorian-grafana
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - todorian-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - metric-network
    profiles:
      - metric

  elasticsearch:
    container_name: todorian-elasticsearch
    image: elasticsearch:7.17.16
    ports:
      - 9200:9200
      - 9300:9300
    volumes:
      - ./elasticsearch:/usr/share/elasticsearch/data
    # Elastic search 계정정보
    environment:
      discovery.type: single-node
      xpack.security.enabled: true
      xpack.security.transport.ssl.enabled: true
      ELASTIC_USERNAME: "todorian"
      ELASTIC_PASSWORD: "todorian!"
      network.host : 0.0.0.0
    networks:
      - elk-network
    profiles:
      - elk

  # Logstash 설정
  logstash:
    container_name: neetopia-logstash
    image: docker.elastic.co/logstash/logstash:7.17.16
    ports:
      - 5000:5000
      - 9600:9600
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    networks:
      - elk-network
    profiles:
      - elk

  # Kibana 설정
  kibana:
    container_name: neetopia-kibana
    image: kibana:7.17.16
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
    networks:
      - elk-network
    profiles:
      - elk

networks:
  db-network:
  cache-network:
  elk-network:
  metric-network:
    driver: bridge

volumes:
  todorian-grafana-data:
  todorian-prometheus-data: